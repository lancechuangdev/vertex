global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: vertex-indexer
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets: [indexer-ethereum:9090]
        labels:
          network: ethereum
      - targets: [indexer-base:9090]
        labels:
          network: base
